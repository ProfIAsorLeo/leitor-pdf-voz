<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Leitor PDF Voz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap');
  :root {
    --bg:#0a0a0f; --surface:#13131a; --surface2:#1c1c26;
    --accent:#00e5a0; --accent2:#0099ff;
    --text:#e8e8f0; --dim:#7070a0; --border:#2a2a3a;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', sans-serif;
  }

  /* HEADER — fixo no topo */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    z-index: 200;
  }
  .logo{width:34px;height:34px;border-radius:9px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  #header h1{font-size:14px;font-weight:600}
  #header p{font-size:11px;color:var(--dim)}

  /* PLAYER — fixo na base */
  #player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 18px 28px;
    z-index: 200;
    display: none;
  }

  /* CONTEÚDO — entre header e player */
  #content {
    position: fixed;
    top: 56px;
    bottom: 0;
    left: 0; right: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* UPLOAD */
  #screen-upload {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 28px 20px;
    gap: 14px;
  }
  .upload-card{width:100%;max-width:360px;background:var(--surface);
               border:2px dashed var(--border);border-radius:20px;padding:36px 24px;text-align:center}
  .upload-card h2{font-size:17px;margin-bottom:8px}
  .upload-card p{font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:22px}
  label.pick{display:inline-block;padding:13px 30px;
             background:linear-gradient(135deg,var(--accent),var(--accent2));
             color:#000;font-weight:700;font-size:15px;border-radius:50px;cursor:pointer;
             -webkit-tap-highlight-color:transparent;user-select:none}
  label.pick:active{opacity:.85}
  #file-input{display:none}
  #err{display:none;width:100%;max-width:360px;background:rgba(255,77,109,.1);
       border:1px solid #ff4d6d;border-radius:12px;padding:12px 16px;
       font-size:13px;color:#ff8fa3;line-height:1.5}

  /* LOADING */
  #screen-loading {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    gap: 16px;
  }
  .spin{width:44px;height:44px;border:3px solid var(--border);
        border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #load-msg{color:var(--dim);font-size:14px;text-align:center;padding:0 20px}

  /* TEXTO */
  #screen-reader { display: none; padding: 16px 18px 20px; }

  .page-divider{display:flex;align-items:center;gap:8px;margin:14px 0 10px}
  .page-divider span{font-size:11px;color:var(--dim);white-space:nowrap;font-weight:600;letter-spacing:.5px}
  .page-divider::before,.page-divider::after{content:'';flex:1;height:1px;background:var(--border)}

  .sent{display:block;margin-bottom:5px;padding:3px 5px;border-radius:5px;
        line-height:1.85;font-size:15px;color:var(--text);transition:background .15s,color .15s}
  .sent.active{background:rgba(0,229,160,.18);color:var(--accent)}

  /* PLAYER internals */
  .file-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .file-ico{width:32px;height:32px;border-radius:7px;flex-shrink:0;
            background:linear-gradient(135deg,#ff6b6b,#ff4d6d);
            display:flex;align-items:center;justify-content:center;font-size:14px}
  #fname{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pct{font-size:11px;color:var(--dim);flex-shrink:0}

  #prog-wrap{width:100%;height:4px;background:var(--surface2);
             border-radius:4px;margin-bottom:12px;cursor:pointer}
  #prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));
            border-radius:4px;transition:width .2s}

  .nav-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .nav-label{font-size:11px;color:var(--dim);white-space:nowrap}
  .nav-input{width:52px;padding:5px 8px;background:var(--surface2);border:1px solid var(--border);
             color:var(--text);font-size:12px;border-radius:7px;font-family:inherit;
             text-align:center;outline:none;-webkit-appearance:none}
  .nav-input:focus{border-color:var(--accent)}
  .nav-total{font-size:11px;color:var(--dim)}
  .nav-go{padding:5px 12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
          color:#000;font-size:11px;font-weight:700;border:none;border-radius:7px;
          cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .nav-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}

  .speed-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
  .spd{padding:5px 9px;border:1px solid var(--border);background:var(--surface2);
       color:var(--dim);font-size:11px;border-radius:6px;cursor:pointer;
       font-family:inherit;-webkit-tap-highlight-color:transparent;transition:all .15s}
  .spd.on{border-color:var(--accent);color:var(--accent);background:rgba(0,229,160,.1)}

  .ctrl-row{display:flex;align-items:center;justify-content:space-between}
  .btns{display:flex;align-items:center;gap:10px}
  .cb{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);
      background:var(--surface2);color:var(--text);font-size:17px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
  .cb:active{opacity:.8}
  #playbtn{width:52px;height:52px;font-size:21px;
           background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#000}
  #newbtn{padding:6px 12px;border:1px solid var(--border);background:var(--surface2);
          color:var(--dim);font-size:11px;border-radius:8px;cursor:pointer;
          font-family:inherit;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<!-- HEADER FIXO -->
<div id="header">
  <div class="logo">🎧</div>
  <div><h1>Leitor PDF Voz</h1><p>Textos da faculdade em áudio</p></div>
</div>

<!-- ÁREA DE CONTEÚDO SCROLLÁVEL -->
<div id="content">

  <!-- UPLOAD -->
  <div id="screen-upload">
    <div class="upload-card">
      <div style="font-size:50px;margin-bottom:14px">📄</div>
      <h2>Selecione seu PDF</h2>
      <p>Toque para escolher o arquivo PDF da sua faculdade</p>
      <label class="pick" for="file-input">📂 Escolher arquivo</label>
      <input type="file" id="file-input" accept=".pdf,.txt">
    </div>
    <div id="err"></div>
  </div>

  <!-- LOADING -->
  <div id="screen-loading">
    <div class="spin"></div>
    <p id="load-msg">Lendo o PDF…</p>
  </div>

  <!-- TEXTO -->
  <div id="screen-reader"></div>

</div>

<!-- PLAYER FIXO NA BASE -->
<div id="player">
  <div class="file-row">
    <div class="file-ico">📄</div>
    <span id="fname">arquivo.pdf</span>
    <span id="pct">0%</span>
  </div>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <div class="nav-row">
    <span class="nav-label">Página</span>
    <input class="nav-input" id="page-input" type="number" min="1" value="1">
    <span class="nav-total" id="page-total">de —</span>
    <button class="nav-go" id="page-go">Ir</button>
    <div class="nav-sep"></div>
    <span class="nav-label">Frase</span>
    <input class="nav-input" id="sent-input" type="number" min="1" value="1">
    <span class="nav-total" id="sent-total">de —</span>
    <button class="nav-go" id="sent-go">Ir</button>
  </div>
  <div class="speed-row">
    <button class="spd"    data-s="0.7">0.7×</button>
    <button class="spd on" data-s="1"  >1×</button>
    <button class="spd"    data-s="1.3">1.3×</button>
    <button class="spd"    data-s="1.6">1.6×</button>
    <button class="spd"    data-s="2"  >2×</button>
  </div>
  <div class="ctrl-row">
    <button id="newbtn">+ Novo PDF</button>
    <div class="btns">
      <div class="cb" id="backbtn">⏮</div>
      <div class="cb" id="playbtn">▶</div>
      <div class="cb" id="fwdbtn">⏭</div>
    </div>
    <div style="width:72px"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = id => document.getElementById(id);

/* ── STATE ── */
let sentences  = [];
let idx        = 0;
let playing    = false;
let speed      = 1;
let safeTimer  = null;
let totalPages = 0;
let pageIndex  = {};
let generation = 0;
let playerH    = 0; // altura do player para padding dinâmico

const synth = window.speechSynthesis;
let voices   = [];
function loadVoices(){ voices = synth ? synth.getVoices() : []; }
loadVoices();
if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;

/* Seleciona a melhor voz disponível:
   1. Google pt-BR (neural, melhor gratuita no Android/Chrome)
   2. Microsoft Francisco/Maria/Francisca (melhor no Windows)
   3. Qualquer voz local pt-BR (offline = geralmente mais fluida)
   4. Qualquer pt-BR, depois qualquer pt */
function bestVoice(){
  const ptBR = voices.filter(v => v.lang === 'pt-BR' || v.lang === 'pt_BR');
  const pt   = voices.filter(v => v.lang.startsWith('pt'));
  const g = ptBR.find(v => v.name.toLowerCase().includes('google'));
  if(g) return g;
  const ms = ptBR.find(v => v.name.toLowerCase().includes('microsoft')
    || v.name.includes('Francisco') || v.name.includes('Francisca') || v.name.includes('Maria'));
  if(ms) return ms;
  const loc = ptBR.find(v => v.localService);
  if(loc) return loc;
  if(ptBR.length) return ptBR[0];
  const lpt = pt.find(v => v.localService);
  if(lpt) return lpt;
  if(pt.length) return pt[0];
  return voices[0] || null;
}

/* ── CALCULA ALTURA DO PLAYER e aplica padding no conteúdo ── */
function applyPlayerPadding(){
  playerH = $('player').offsetHeight;
  $('screen-reader').style.paddingBottom = (playerH + 20) + 'px';
}

/* ── TELAS ── */
function show(id){
  $('screen-upload').style.display  = 'none';
  $('screen-loading').style.display = 'none';
  $('screen-reader').style.display  = 'none';
  $('player').style.display         = 'none';

  if(id === 'screen-upload'){
    $('screen-upload').style.display = 'flex';
  } else if(id === 'screen-loading'){
    $('screen-loading').style.display = 'flex';
  } else if(id === 'screen-reader'){
    $('screen-reader').style.display = 'block';
    $('player').style.display        = 'block';
    setTimeout(applyPlayerPadding, 100);
  }
}
show('screen-upload');

/* ── ABREVIAÇÕES ── */
const ABBREVS = ['Dr','Dra','Prof','Profa','Sr','Sra','D','Mr','Mrs','Ms',
  'p','pp','v','vol','n','ed','org','coord','trad','rev','art','fig','tab',
  'op','cit','ibid','apud','cf','séc','pág','etc','ex','obs','ref','cap','tel','av'];
const abbrevRE = new RegExp('\\b(' + ABBREVS.join('|') + ')\\.', 'gi');

function splitSentences(text){
  text = text.replace(/\f/g,' ').replace(/\r\n?/g,' ').replace(/\s+/g,' ').trim();
  text = text.replace(abbrevRE, (_, a) => a + '■');
  text = text.replace(/(\d)\.(\d)/g, '$1■$2');
  const raw = text
    .split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÀÂÊÔÃÕÜ\u00C0-\u024F])/)
    .map(s => s.replace(/■/g, '.').trim())
    .filter(s => s.length > 0);
  const merged = [];
  let buf = '';
  for(const s of raw){
    buf = buf ? buf + ' ' + s : s;
    if(buf.trim().split(/\s+/).length >= 4){ merged.push(buf.trim()); buf = ''; }
  }
  if(buf.trim()) merged.push(buf.trim());
  return merged.filter(s => s.length > 0);
}

/* ── EXTRAÇÃO DO PDF ── */
async function extractPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  totalPages = pdf.numPages;
  let fullText = '';

  for(let p = 1; p <= pdf.numPages; p++){
    $('load-msg').textContent = `Lendo página ${p} de ${pdf.numPages}…`;
    const page    = await pdf.getPage(p);
    const vp      = page.getViewport({ scale: 1 });
    const content = await page.getTextContent();
    const pgH     = vp.height;
    const pgW     = vp.width;
    const MARGIN  = pgH * 0.08;

    const items = content.items.filter(it => {
      if(!it.str || !it.str.trim()) return false;
      const y = it.transform[5];
      if(y < MARGIN || y > pgH - MARGIN) return false;
      if(/^\s*\d{1,4}\s*$/.test(it.str)) return false;
      if(it.str.trim().length === 1) return false;
      return true;
    });

    if(items.length === 0) continue;

    // Agrupa em linhas (Y ± 3pt)
    const lines = [];
    const byY = [...items].sort((a,b) => b.transform[5] - a.transform[5]);
    for(const it of byY){
      const y  = it.transform[5];
      const ln = lines.find(l => Math.abs(l.y - y) <= 3);
      if(ln){ ln.items.push(it); }
      else   { lines.push({ y, items: [it] }); }
    }
    lines.forEach(l => l.items.sort((a,b) => a.transform[4] - b.transform[4]));

    // Detecta duas colunas
    const midX    = pgW / 2;
    const margin  = pgW * 0.1;
    const midLines = lines.filter(l => l.y > pgH*0.15 && l.y < pgH*0.85);
    let twoCol = false;
    if(midLines.length > 6){
      const crossing = midLines.filter(l => {
        const xs = l.items.map(it => it.transform[4]);
        return Math.min(...xs) < midX - margin && Math.max(...xs) > midX + margin;
      });
      twoCol = crossing.length < midLines.length * 0.25;
    }

    let pageText;
    if(twoCol){
      const left  = lines.map(l => ({...l, items: l.items.filter(it => it.transform[4] < midX)})).filter(l => l.items.length > 0);
      const right = lines.map(l => ({...l, items: l.items.filter(it => it.transform[4] >= midX)})).filter(l => l.items.length > 0);
      pageText = buildText(left) + ' ' + buildText(right);
    } else {
      pageText = buildText(lines);
    }

    fullText += `[[P${p}]] ` + pageText + ' ';
  }
  return fullText;
}

function buildText(lines){
  let text = '', prevEndX = null, prevStr = '';
  for(const line of lines){
    for(const it of line.items){
      const s = it.str, x = it.transform[4], endX = x + (it.width || 0);
      if(text === ''){ text = s; prevStr = s; prevEndX = endX; continue; }
      const isLineBreak = prevEndX !== null && x < prevEndX * 0.5;
      if(isLineBreak && prevStr.endsWith('-')){ text = text.slice(0,-1) + s; }
      else { text += ' ' + s; }
      prevStr = s; prevEndX = endX;
    }
  }
  return text.trim();
}

/* ── RENDERIZAÇÃO ── */
function renderSentences(){
  const ta = $('screen-reader');
  ta.innerHTML = '';
  let curPage = 0;
  sentences.forEach((s, i) => {
    if(s.page !== curPage){
      curPage = s.page;
      const div = document.createElement('div');
      div.className = 'page-divider';
      div.innerHTML = `<span>PÁGINA ${curPage}</span>`;
      ta.appendChild(div);
    }
    const el = document.createElement('span');
    el.className   = 'sent';
    el.id          = 's' + i;
    el.textContent = s.text;
    ta.appendChild(el);
  });
  $('page-total').textContent = `de ${totalPages}`;
  $('sent-total').textContent = `de ${sentences.length}`;
  $('page-input').max = totalPages;
  $('sent-input').max = sentences.length;
  idx = 0;
}

function highlight(i){
  document.querySelectorAll('.sent.active').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('s' + i);
  if(!el) return;
  el.classList.add('active');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ── MOTOR DE VOZ ── */
function speakAt(i){
  if(!playing) return;
  if(i >= sentences.length){
    playing = false; $('playbtn').textContent = '▶'; idx = 0; updateUI(); return;
  }
  const myGen = generation;
  highlight(i); idx = i; updateUI();
  const text = sentences[i].text;
  const u    = new SpeechSynthesisUtterance(text);
  u.rate     = speed;
  u.lang     = 'pt-BR';
  u.pitch    = 1.05;   // levemente mais alto — soa menos robótico
  u.volume   = 1;
  const v = bestVoice(); if(v) u.voice = v;
  const wc = text.split(/\s+/).length;
  const estMs = Math.max(2500, (wc/130)*60000/speed + 2000);
  if(safeTimer) clearTimeout(safeTimer);
  let advanced = false;
  const advance = () => {
    if(advanced || generation !== myGen) return;
    advanced = true; clearTimeout(safeTimer);
    setTimeout(() => { if(playing && generation === myGen) speakAt(i+1); }, 60);
  };
  u.onend   = advance;
  u.onerror = e => { if(e.error === 'canceled' || e.error === 'cancelled') return; advance(); };
  safeTimer = setTimeout(advance, estMs);
  synth.speak(u);
}

function play(){ if(idx >= sentences.length) idx = 0; playing = true; $('playbtn').textContent = '⏸'; speakAt(idx); }
function pause(){ generation++; playing = false; $('playbtn').textContent = '▶'; if(safeTimer) clearTimeout(safeTimer); synth.cancel(); }

function jumpTo(i){
  const wasPlaying = playing; pause();
  idx = Math.max(0, Math.min(sentences.length-1, i));
  updateUI(); highlight(idx);
  if(wasPlaying) play();
}

$('playbtn').onclick = () => playing ? pause() : play();
$('backbtn').onclick = () => jumpTo(idx - 1);
$('fwdbtn').onclick  = () => jumpTo(idx + 1);

$('page-go').onclick = () => {
  const p = parseInt($('page-input').value);
  if(!p || p < 1 || p > totalPages) return;
  const i = pageIndex[p]; if(i !== undefined) jumpTo(i);
};
$('page-input').addEventListener('keydown', e => { if(e.key === 'Enter') $('page-go').click(); });

$('sent-go').onclick = () => {
  const n = parseInt($('sent-input').value);
  if(!n || n < 1 || n > sentences.length) return;
  jumpTo(n - 1);
};
$('sent-input').addEventListener('keydown', e => { if(e.key === 'Enter') $('sent-go').click(); });

document.querySelectorAll('.spd').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.spd').forEach(b => b.classList.remove('on'));
    btn.classList.add('on'); speed = parseFloat(btn.dataset.s);
    const wasPlaying = playing; pause(); if(wasPlaying) play();
  };
});

function updateUI(){
  if(!sentences.length) return;
  const p = Math.round((idx / sentences.length) * 100);
  $('prog-bar').style.width = p + '%'; $('pct').textContent = p + '%';
  const s = sentences[idx];
  if(s){ $('page-input').value = s.page; $('sent-input').value = idx + 1; }
}

$('prog-wrap').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  jumpTo(Math.floor(((e.clientX - r.left) / r.width) * sentences.length));
};

$('newbtn').onclick = () => {
  pause(); sentences = []; idx = 0; totalPages = 0; pageIndex = {};
  $('file-input').value = ''; $('err').style.display = 'none';
  show('screen-upload');
};

$('file-input').addEventListener('change', e => {
  const f = e.target.files[0]; if(f) handleFile(f);
});

async function handleFile(file){
  $('fname').textContent = file.name; $('err').style.display = 'none';
  show('screen-loading');
  try{
    let rawText;
    if(file.name.toLowerCase().endsWith('.pdf')){
      rawText = await extractPDF(file);
    } else {
      totalPages = 1; rawText = '[[P1]] ' + await file.text();
    }
    if(!rawText || !rawText.trim()) throw new Error('O PDF não contém texto extraível.');

    const pageChunks = []; const markerRE = /\[\[P(\d+)\]\]/g;
    let match, lastPos = 0, lastPage = 1;
    while((match = markerRE.exec(rawText)) !== null){
      if(match.index > lastPos && lastPos > 0)
        pageChunks.push({ page: lastPage, text: rawText.slice(lastPos, match.index) });
      lastPage = parseInt(match[1]); lastPos = match.index + match[0].length;
    }
    if(lastPos < rawText.length)
      pageChunks.push({ page: lastPage, text: rawText.slice(lastPos) });

    sentences = []; pageIndex = {};
    for(const chunk of pageChunks){
      const frases = splitSentences(chunk.text.trim());
      if(!pageIndex.hasOwnProperty(chunk.page)) pageIndex[chunk.page] = sentences.length;
      frases.forEach(t => sentences.push({ text: t, page: chunk.page }));
    }
    if(sentences.length === 0) throw new Error('Não foi possível identificar frases no documento.');

    renderSentences(); updateUI(); show('screen-reader');
  } catch(err){
    $('err').textContent = '⚠️ ' + err.message; $('err').style.display = 'block';
    show('screen-upload');
  }
}

window.addEventListener('resize', applyPlayerPadding);
setInterval(() => { if(playing && synth.paused) synth.resume(); }, 5000);
</script>
